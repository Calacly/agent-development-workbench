[package]
name = "mcp-client"
version = "0.1.0"
edition = "2021"
authors = ["MCP Client Contributors"]
license = "MIT"
description = "Web app for working with LLMs and MCP servers: API and server-rendered UI in one binary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mcp-client"
path = "src/main.rs"

[dependencies]
# Async runtime and web framework
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }
http = "1.0"
http-body-util = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }

# Authentication and security
jsonwebtoken = "9.3"
argon2 = "0.5"
secrecy = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# MCP client
# "reqwest-native-tls": without a TLS feature rmcp's reqwest cannot reach any https:// MCP server
rmcp = { version = "3.10", features = ["client", "reqwest-native-tls", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.12", features = ["json"] }
sse-stream = "0.2"

# Web UI: templates, embedded static files, Markdown
askama = "0.16.1"
rust-embed = "8.14.0"
mime_guess = "2.0.5"
pulldown-cmark = "0.13.6"
ammonia = "4.2.5"
url = "2.5.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Errors, configuration, time
anyhow = "1.0"
thiserror = "2.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

# System interfaces (sandboxing on Unix)
libc = "0.2"
