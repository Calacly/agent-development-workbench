{% extends "base.html" %}
{% block title %}Error {{ status }} · MCP Client{% endblock %}
{% block body %}
<main class="auth">
	<div class="auth-card">
		<h1>Something went wrong</h1>
		<p class="alert alert-error">{{ message }}</p>
		<p class="muted small">Error {{ status }}</p>
		<a class="btn" href="/dashboard">Back to the dashboard</a>
	</div>
</main>
{% endblock %}
